<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>AKTIN DWH Update</title>
  <style>
    h1 {
      font-family: Arial, Helvetica, sans-serif;
    }

    .loader {
      border: 4px solid #DDD;
      border-top: 4px solid #000;
      border-radius: 50%;
      width: 21px;
      height: 21px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script src="jquery-3.2.1.min.js"></script>
</head>

<body>
  <div style="display:flex; position:absolute; top:0; bottom:0; right:0; left:0; ">
    <div style="margin:auto;">
      <div style="display:inline-table;">
        <div style="display:table-cell;">
          <h1>Das AKTIN DWH wird aktualisiert&nbsp;</h1>
        </div>
        <div style="display:table-cell;">
          <div class="loader"></div>
        </div>
      </div>
    </div>
  </div>


  <script language="Javascript">
    const CHECK_DELAY_MS = 10 * 1000;   // delay until next check. Keep reasonably high to avoid call overload
    // Relative, so it resolves against the origin (and port) of the DWH that opened this page
    const DWH_HOME_URL = "/aktin/admin/#/home";
    const IMPORT_SUMMARY_URL = "/aktin/admin/rest/import-summary";
    // server start time before the update, a different value means the DWH has restarted
    const PRE_UPDATE_START = new URLSearchParams(window.location.search).get("since");

    document.addEventListener("DOMContentLoaded", checkDwhRestarted);

    /*
     * Polls the import summary after an update.
     * Retries while the DWH is unreachable or still reports the pre-update
     * start time, and redirects to the landing page once it has restarted.
     */
    function checkDwhRestarted() {
        $.ajax({
            type: "GET",
            url: IMPORT_SUMMARY_URL,
            dataType: "xml",
            cache: false,
            error: function (xhr, status, error) {
                console.log(error);
                setTimeout(checkDwhRestarted, CHECK_DELAY_MS);
            },
            success: function (xml) {
                const start = String(new Date($(xml).find("start").text()).getTime());
                if (start !== PRE_UPDATE_START) {
                    // the update agent writes its result a few seconds after the DWH is up again
                    setTimeout(function () {
                        window.location = DWH_HOME_URL;
                    }, CHECK_DELAY_MS);
                } else {
                    setTimeout(checkDwhRestarted, CHECK_DELAY_MS);
                }
            }
        });
    }
  </script>
</body>

</html>
