<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>AKTIN DWH Update</title>
  <style>
    h1 {
      font-family: Arial, Helvetica, sans-serif;
    }

    .loader {
      border: 4px solid #DDD;
      border-top: 4px solid #000;
      border-radius: 50%;
      width: 21px;
      height: 21px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script src="jquery-3.2.1.min.js"></script>
</head>

<body>
  <div style="display:flex; position:absolute; top:0; bottom:0; right:0; left:0; ">
    <div style="margin:auto;">
      <div style="display:inline-table;">
        <div style="display:table-cell;">
          <h1>Das AKTIN DWH wird aktualisiert&nbsp;</h1>
        </div>
        <div style="display:table-cell;">
          <div class="loader"></div>
        </div>
      </div>
    </div>
  </div>


  <script language="Javascript">
    const INITIAL_DELAY_MS = 25 * 1000;
    const CHECK_DELAY_MS = 10 * 1000;   // delay until next check, after a check has failed. Keep reasonably high to avoid call overload
    const DEFAULT_PORT = '80';

    // First check happens 25s after page load, giving the update process time to restart services
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(checkDwhAvailability, INITIAL_DELAY_MS);
    });

    // Get cookies of current session by name
    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
    }

    function getDwhBaseUrl() {
        let port = getCookie('PORT');
        if (port === null || port === undefined || port === '') {
            port = DEFAULT_PORT;
        }
        return window.location.protocol + '//' + window.location.hostname + ':' + port;
    }

    /*
     * Polls the data warehouse's admin page after an update.
     * Retries on failure (DWH still restarting) and redirects to the
     * landing page as soon as it responds successfully.
     */
    function checkDwhAvailability() {
        const url = getDwhBaseUrl() + "/aktin/admin/#/home";

        $.ajax({
            type: "HEAD",
            url: url,
            dataType: "text",
            beforeSend: function (request) {
                // no-cache headers to avoid a false positive from a cached response
                request.setRequestHeader("pragma", "no-cache");
                request.setRequestHeader("cache-control", "no-cache");
            },
            error: function (xhr, status, error) {
                console.log(error);
                setTimeout(checkDwhAvailability, CHECK_DELAY_MS);
            },
            success: function () {
                window.location = url;
            }
        });
    }
  </script>
</body>

</html>
