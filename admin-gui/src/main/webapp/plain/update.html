<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>AKTIN DWH Update</title>
  <style>
    h1 {
      font-family: Arial, Helvetica, sans-serif;
    }

    .loader {
      border: 4px solid #DDD;
      border-top: 4px solid #000;
      border-radius: 50%;
      width: 21px;
      height: 21px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script src="jquery-3.2.1.min.js"></script>
</head>

<body>
  <div style="display:flex; position:absolute; top:0; bottom:0; right:0; left:0; ">
    <div style="margin:auto;">
      <div style="display:inline-table;">
        <div style="display:table-cell;">
          <h1>Das AKTIN DWH wird aktualisiert&nbsp;</h1>
        </div>
        <div style="display:table-cell;">
          <div class="loader"></div>
        </div>
      </div>
    </div>
  </div>

  <script language="Javascript">

    // first call on 25secs after page-load
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(function () {
        call_dwh(this);
      }, 25 * 1000);
    });

    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
    }

    // check if aktin homepage is up
    // redirect if true, else check again in 5 min
    // no-cache headers to avoid false positive
    function call_dwh(el) {
        const port = getCookie('PORT');
        const base = port ? window.location.protocol + '//' + window.location.hostname + ':' + port : '';
        const checkInterval = 1 * 10 * 1000

        $.ajax({
        type: "HEAD",
        beforeSend: function (request) {
          request.setRequestHeader("pragma", "no-cache");
          request.setRequestHeader("cache-control", "no-cache");
        },
        url: base + "/aktin/admin/#/home",
        data: "",
        success: function (data, status, xhr) {
          window.location = this.url;
        },
        error: function (xhr, status, error) {
          console.log(error)
          // interval check, if the DWH is online after an update. Good reference are 10 seconds,
          // to reduce waiting time while DWH is online again.
          setTimeout(function () {
            call_dwh(this);
          }, checkInterval);
        },
        dataType: "text"
      });
    }
  </script>
</body>

</html>
