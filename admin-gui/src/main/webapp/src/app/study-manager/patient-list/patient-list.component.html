<div class="ui grid column">
    <div class="row">
        <div class="ui breadcrumb column">
            <div class="active section breadcrumb-header">Studien-Manager</div>
        </div>
    </div>

    <div class="row">
        <div class="ui column form">
            <div class="field">
                <label>Studie</label>
                <drop-down [(ngModel)]="selectedStudy"
                           [compare]="compareStudies"
                           name="studies">
                    @for (study of studies; track study.id) {
                        <drop-down-option [value]="study">{{ study.title }}</drop-down-option>
                    }
                </drop-down>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="ui column">
            <div class="ui segment column form">
                <div class="field">
                    <label>Zeitraum</label>
                    <div class="ui action input">
                        <input #d="angular-mydatepicker"
                               [(ngModel)]="date"
                               [options]="options"
                               angular-mydatepicker
                               name="dp"/>
                        <button (click)="d.toggleCalendar()"
                                class="ui icon button"
                                type="button">
                            <i class="calendar icon"></i>
                        </button>
                        <button (click)="resetFilter()"
                                class="ui labeled icon button"
                                type="button">
                            <i class="close icon"></i> Zurücksetzen
                        </button>
                        <button (click)="filter()"
                                class="ui labeled icon button"
                                type="button">
                            <i class="filter icon"></i> Filtern
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- TODO: AuditTrail -->
    <div class="row">
        <div class="ui column">
            <div class="ui segment">
                <div class="ui grid">
                    <div class="row">
                        <div class="ui column">
                            <div class="ui primary basic right floated buttons">
                                <button (click)="openPatientCreationModal()"
                                     class="ui labeled icon button">
                                    <i class="user plus icon"></i>
                                    Registrieren
                                </button>
                                <div #batchAddDropdown
                                     class="ui floating dropdown icon button">
                                    <i class="dropdown icon"></i>
                                    <div class="menu">
                                        <button (click)="openPatientsCreationModal()"
                                             class="ui labeled icon button item">
                                            <i class="users icon"></i>
                                            Multi-Registrierung
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <data-table (onDetailsClick)="openPatientViewModal($event)"
                                    [columns]="columns"
                                    [data]="filteredEntries"
                                    class="ui column"></data-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
